name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 代码质量、单元测试与编译检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 设置 Node.js 和依赖缓存
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码质量检查
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 类型检查、生产构建与注入脚本校验
        run: pnpm build
